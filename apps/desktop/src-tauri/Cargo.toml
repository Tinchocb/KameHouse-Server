[package]
name = "kamehouse-desktop"
version = "0.1.0"
description = "Tauri-based Desktop client for KameHouse"
authors = ["KameHouse"]
license = "MIT"
repository = "https://github.com/5rahim/kamehouse"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kamehouse_desktop_lib"
# Solo rlib: staticlib/cdylib son para targets móviles (iOS/Android), que no
# usamos. En Windows generaban un .lib de ~250MB + una DLL en cada build de dev.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync"] }
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }

[profile.dev]
debug = 0
split-debuginfo = "off"

# Release optimizado para tamaño de binario (el lado Rust es IPC/ventanas, no
# cómputo pesado, así que opt-level "s" no penaliza en la práctica).
# Se omite panic = "abort" a propósito: mantiene el unwinding para que un panic
# en un handler IPC no tumbe toda la app.
[profile.release]
codegen-units = 4   # 4 unidades: balance entre velocidad de compilación y optimización cross-crate
lto = true          # link-time optimization: binario más chico y rápido
opt-level = "s"     # optimizar para tamaño
strip = true        # quitar símbolos de debug del binario final

# Profile-Guided Optimization (PGO) configuration
# 1. Compile with: RUSTFLAGS="-Zprofile -Ccodegen-units=1" cargo build --release
# 2. Run representative workload (play video, scan library, etc.)
# 3. Compile with: RUSTFLAGS="-Zprofile-use=default_<hash>.profdata" cargo build --release
# See: https://doc.rust-lang.org/rustc/profile-guided-optimization.html

# [profile.release.pgo]
# # Uncomment after generating profile data
# # codegen-units = 1
# # lto = true
