<!doctype html>
<html lang="es">
<!--
    Splash de arranque del cliente de escritorio (Tauri).
    Debe ser 100% estático y liviano: se pinta al instante mientras el sidecar
    arranca y la ventana principal (oculta) carga el bundle React.
    Rust actualiza el texto de estado vía `window.setStatus(...)`.
-->
<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>KameHouse</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #09090b;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Toda la ventana arrastrable (no tiene decoraciones) */
            -webkit-app-region: drag;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
        }
        h1 {
            color: #fff;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            margin: 0 0 0 0.3em;
            line-height: 1;
            text-shadow: 0 0 28px rgba(245, 158, 11, 0.3);
        }
        .dots {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 32px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b 60%, #b45309 100%);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.65), 0 0 6px rgba(251, 191, 36, 0.9);
            animation: ball-bounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        #status {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #71717a;
            margin-top: -0.5rem;
        }
        @keyframes ball-bounce {
            0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.4; }
            40% { transform: translateY(-12px) scale(1.1); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>KAMEHOUSE</h1>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <span id="status">Iniciando KameHouse...</span>
    </div>
    <script>
        window.setStatus = function (text) {
            var el = document.getElementById("status");
            if (el) el.textContent = text;
        };
        // Texto inicial opcional vía hash (lo usa scripts/dev-splash.ps1 en dev).
        if (location.hash.length > 1) {
            try { window.setStatus(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
        }
    </script>
</body>

</html>
